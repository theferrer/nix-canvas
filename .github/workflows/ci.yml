name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - run: nix flake check

  manifesto:
    # Canvas knows no concrete applications: no app names in the framework
    # code (option examples excepted - the grep list avoids the few names
    # used illustratively there).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: No concrete app knowledge in modules/ or lib/
        run: |
          ! grep -rniE '\b(sway|niri|cosmic|river|wayfire|gnome|plasma|kde|waybar|polybar|rofi|dunst|mako|firefox|chromium|brave|alacritty|wezterm|ghostty|picom|feh|swww|grim|slurp)\b' modules/ lib/

  tag-matches-version:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - name: Tag equals lib.version
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          ver=$(nix eval --raw .#lib.version)
          [ "$tag" = "$ver" ]
